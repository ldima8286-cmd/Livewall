name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Build installer
        run: cmake --build build --target installer
      - name: Package portable ZIP
        run: cmake --build build --target portable
      - uses: actions/upload-artifact@v4
        with:
          name: livewall-msvc-x64
          path: |
            build/dist/livewall.exe
            build/dist/LiveWall-*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: livewall-portable-x64
          path: build/dist/LiveWall-*-portable.zip
          if-no-files-found: error

  mingw:
    name: MinGW-w64 (UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-mingw
      - uses: actions/upload-artifact@v4
        with:
          name: livewall-mingw-x64
          path: build-mingw/dist/livewall.exe
          if-no-files-found: error
